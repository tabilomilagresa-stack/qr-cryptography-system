<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Google Drive QR Generator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            margin-bottom: 10px;
        }

        #qrcode {
            margin: 25px auto;
            width: 300px;
            height: 300px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        #message {
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Google Drive QR Code</h1>

    <p>Scan this QR code to open the Google Drive folder.</p>

    <div id="qrcode"></div>

    <button onclick="downloadQR()">
        Download QR
    </button>

    <p id="message"></p>

</div>


<!-- QR CODE LIBRARY -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


<script>

    // YOUR GOOGLE DRIVE LINK
    const driveLink =
        "https://drive.google.com/drive/folders/1RETgm-2Qz3xCg-fZcfvCxPBOPu2_xmG4?usp=drive_link";


    // CREATE QR CODE
    const qr = new QRCode(
        document.getElementById("qrcode"),
        {
            text: driveLink,

            width: 300,

            height: 300,

            colorDark: "#000000",

            colorLight: "#ffffff",

            correctLevel:
                QRCode.CorrectLevel.H
        }
    );


    // DOWNLOAD QR
    function downloadQR() {

        const canvas =
            document.querySelector("#qrcode canvas");

        if (!canvas) {

            document.getElementById("message")
                .textContent =
                "QR Code is not ready.";

            return;
        }


        const link =
            document.createElement("a");

        link.download =
            "google-drive-qr.png";

        link.href =
            canvas.toDataURL("image/png");

        link.click();


        document.getElementById("message")
            .textContent =
            "QR Code downloaded!";

    }

</script>

</body>
</html>
